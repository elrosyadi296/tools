<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #161616;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --sub: #888;
    --accent: #1d9bf0;
    --like: #f91880;
    --green: #00ba7c;
    --orange: #ff7043;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 60px;
  }

  h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sub);
    margin-bottom: 28px;
  }

  /* ===== LAYOUT ===== */
  .wrap {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 28px;
    width: 100%;
    max-width: 860px;
    align-items: start;
  }

  /* ===== EDITOR PANEL ===== */
  .editor {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: sticky;
    top: 30px;
  }

  .editor-title {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sub);
    margin-bottom: 4px;
  }

  .field-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; color: var(--sub); font-weight: 500; }

  input[type=text], input[type=number], textarea, select {
    background: #111;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 9px 12px;
    width: 100%;
    outline: none;
    transition: border-color .2s;
  }
  input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus {
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* Avatar upload */
  .avatar-pick {
    display: flex; align-items: center; gap: 12px;
  }
  .avatar-preview {
    width: 52px; height: 52px; border-radius: 50%;
    background: #222; border: 2px solid var(--border);
    object-fit: cover; flex-shrink: 0;
    cursor: pointer;
  }
  .avatar-hint { font-size: 11px; color: var(--sub); }
  #avatarInput { display: none; }

  /* Post image upload */
  .img-pick {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .img-thumb {
    width: 64px; height: 48px; border-radius: 8px;
    object-fit: cover; border: 1px solid var(--border);
    display: none;
  }
  #postImgInput { display: none; }
  .upload-btn {
    font-size: 11px; color: var(--accent);
    border: 1px dashed var(--accent);
    border-radius: 8px; padding: 6px 12px;
    cursor: pointer; background: transparent;
    transition: background .2s;
  }
  .upload-btn:hover { background: rgba(29,155,240,.1); }
  .clear-img-btn {
    font-size: 11px; color: var(--sub);
    background: none; border: none; cursor: pointer;
    display: none;
  }

  /* Platform toggle */
  .platform-toggle {
    display: flex; gap: 8px;
  }
  .pt-btn {
    flex: 1; padding: 7px; border-radius: 8px;
    border: 1px solid var(--border);
    background: #111; color: var(--sub);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .2s;
  }
  .pt-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }

  /* Generate button */
  .gen-btn {
    background: var(--accent); color: #fff;
    border: none; border-radius: 10px;
    padding: 11px; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: .5px;
    cursor: pointer; transition: opacity .2s;
    margin-top: 4px;
  }
  .gen-btn:hover { opacity: .85; }

  /* Screenshot btn */
  .ss-btn {
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px; font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  .ss-btn:hover { background: rgba(29,155,240,.1); }

  /* ===== PREVIEW AREA ===== */
  .preview-area {
    display: flex; flex-direction: column; gap: 16px;
  }

  .preview-label {
    font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--sub);
  }

  /* ===== CARD ===== */
  #postCard {
    background: #000;
    border: 1px solid #2f3336;
    border-radius: 16px;
    padding: 20px 20px 16px;
    max-width: 600px;
    font-family: 'DM Sans', sans-serif;
  }
  #postCard.threads-theme {
    background: #101010;
    border-color: #303030;
  }

  .card-top {
    display: flex; gap: 12px; align-items: flex-start;
  }

  #cardAvatar {
    width: 44px; height: 44px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    background: #333;
  }
  .threads-theme #cardAvatar { border-radius: 50%; }

  .card-meta { flex: 1; }
  .card-name-row {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .card-meta-stack {
    display: flex; flex-direction: column; gap: 1px;
  }
  .card-name-line {
    display: flex; align-items: center; gap: 5px;
  }
  #cardName {
    font-size: 15px; font-weight: 700; color: #e7e9ea;
  }
  #cardVerified {
    display: none;
    width: 18px; height: 18px;
  }
  #cardHandle {
    font-size: 13px; color: #71767b;
  }
  #cardTime {
    font-size: 14px; color: #71767b;
  }
  #cardTime::before { content: " · "; }

  /* Threads style meta */
  .threads-theme #cardName { color: #f5f5f5; font-size: 14px; }
  .threads-theme #cardHandle { display: none; }
  .threads-theme #cardTime { font-size: 13px; }

  /* More icon */
  .card-more {
    margin-left: auto; color: #71767b;
    font-size: 18px; cursor: pointer;
  }

  /* Post content */
  #cardContent {
    font-size: 15px; line-height: 1.6;
    color: #e7e9ea; margin: 12px 0 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .threads-theme #cardContent { font-size: 14px; color: #f5f5f5; }

  /* Post image */
  #cardPostImg {
    width: 100%; border-radius: 14px;
    object-fit: cover; max-height: 340px;
    display: none; margin-bottom: 14px;
    border: 1px solid #2f3336;
  }

  /* Actions */
  .card-actions {
    display: flex; gap: 0; margin-top: 4px;
  }
  .action-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none;
    color: #71767b; font-family: 'DM Sans', sans-serif;
    font-size: 13px; cursor: pointer;
    padding: 8px 12px 8px 0;
    border-radius: 999px;
    transition: color .2s;
    flex: 1;
  }
  .action-btn:hover.like   { color: var(--like); }
  .action-btn:hover.reply  { color: var(--accent); }
  .action-btn:hover.repost { color: var(--green); }
  .action-btn:hover.share  { color: var(--accent); }
  .action-btn svg { width: 18px; height: 18px; }
  #likeCount, #replyCount, #repostCount { font-size: 13px; }

  /* Source bar */
  .card-source {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid #2f3336;
    font-size: 13px; color: #71767b;
    display: flex; align-items: center; gap: 6px;
  }
  .threads-theme .card-source { border-color: #303030; }

  /* Platform badge */
  .platform-badge {
    display: flex; align-items: center; gap: 5px;
    margin-left: auto; font-size: 12px; color: #555;
  }
  .platform-badge svg { width: 16px; height: 16px; fill: #555; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 680px) {
    .wrap { grid-template-columns: 1fr; }
    .editor { position: static; }
  }
</style>
</head>

<h1>✦ Fake Post Generator</h1>

<div class="wrap">

    </div>

        <button class="upload-btn" onclick="document.getElementById('postImgInput').click()">+ Upload Gambar</button>

  <div class="preview-area">

    <div id="postCard">

          <div class="card-meta-stack">

<script>
let platform = 'x';
let postImgData = null;
let avatarData = null;

function setPlatform(p) {
  platform = p;
  document.getElementById('btnX').classList.toggle('active', p === 'x');
  document.getElementById('btnT').classList.toggle('active', p === 'threads');
  const card = document.getElementById('postCard');
  card.classList.toggle('threads-theme', p === 'threads');
  const badge = document.getElementById('platformBadge');
  if (p === 'threads') {
    badge.innerHTML = `<svg viewBox="0 0 50 50" width="16" height="16" fill="#555"><path d="M 25 5 C 13.972656 5 5 13.972656 5 25 C 5 36.027344 13.972656 45 25 45 C 36.027344 45 45 36.027344 45 25 C 45 13.972656 36.027344 5 25 5 Z M 25 7 C 34.941406 7 43 15.058594 43 25 C 43 34.941406 34.941406 43 25 43 C 15.058594 43 7 34.941406 7 25 C 7 15.058594 15.058594 7 25 7 Z M 25 12 C 18.382813 12 13 17.382813 13 24 C 13 28.265625 15.238281 32.003906 18.59375 34.1875 C 17.964844 31.882813 17.945313 29.554688 18.84375 27.375 C 19.25 26.398438 19.863281 25.527344 20.65625 24.84375 C 21.449219 24.160156 22.410156 23.679688 23.46875 23.46875 C 22.921875 22.390625 22.460938 21.238281 22.15625 20 C 21.648438 17.929688 21.617188 15.652344 22.65625 13.625 C 23.394531 12.132813 24.597656 12 25 12 Z M 25.40625 14.03125 C 25.117188 14.105469 24.761719 14.425781 24.4375 15.0625 C 23.617188 16.714844 23.660156 18.660156 24.125 20.5 C 24.347656 21.382813 24.679688 22.222656 25.09375 23 C 26.140625 22.980469 27.191406 23.09375 28.1875 23.375 C 30.132813 23.917969 31.777344 25.070313 32.84375 26.75 C 33.675781 28.082031 34.058594 29.679688 33.9375 31.28125 C 33.816406 32.882813 33.191406 34.394531 32.15625 35.5625 C 33.847656 34.394531 35.09375 32.652344 35.71875 30.65625 C 36.515625 28.140625 36.238281 25.335938 34.96875 23.03125 C 33.699219 20.726563 31.46875 18.957031 28.84375 18.15625 C 28.03125 17.910156 27.183594 17.773438 26.34375 17.71875 C 26.070313 16.394531 25.925781 15.019531 25.40625 14.03125 Z M 24.28125 24.59375 C 23.492188 24.742188 22.761719 25.097656 22.15625 25.625 C 21.550781 26.152344 21.082031 26.832031 20.78125 27.59375 C 20.074219 29.347656 20.179688 31.394531 20.875 33.1875 C 21.09375 33.742188 21.363281 34.273438 21.6875 34.75 C 22.757813 34.917969 23.867188 35 25 35 C 26.542969 35 28.015625 34.773438 29.40625 34.34375 C 30.363281 33.238281 30.875 31.71875 30.96875 30.21875 C 31.058594 28.792969 30.734375 27.386719 29.96875 26.1875 C 29.203125 24.988281 28.011719 24.214844 26.5625 23.8125 C 25.835938 23.613281 25.054688 23.546875 24.28125 24.59375 Z"/></svg>`;
  } else {
    badge.innerHTML = `<svg viewBox="0 0 24 24" fill="#555"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`;
  }
  update();
}

function loadAvatar(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    avatarData = e.target.result;
    document.getElementById('avatarPreview').src = avatarData;
    document.getElementById('cardAvatar').src = avatarData;
  };
  reader.readAsDataURL(input.files[0]);
}

function loadPostImg(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    postImgData = e.target.result;
    document.getElementById('imgThumb').src = postImgData;
    document.getElementById('imgThumb').style.display = 'block';
    document.getElementById('clearImgBtn').style.display = 'inline';
    document.getElementById('cardPostImg').src = postImgData;
    document.getElementById('cardPostImg').style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

function clearPostImg() {
  postImgData = null;
  document.getElementById('imgThumb').style.display = 'none';
  document.getElementById('clearImgBtn').style.display = 'none';
  document.getElementById('cardPostImg').style.display = 'none';
  document.getElementById('postImgInput').value = '';
}

function update() {
  const name    = document.getElementById('inputName').value || 'Nama User';
  const handle  = document.getElementById('inputHandle').value || '@username';
  const time    = document.getElementById('inputTime').value || '1j';
  const content = document.getElementById('inputContent').value;
  const like    = document.getElementById('inputLike').value || '0';
  const reply   = document.getElementById('inputReply').value || '0';
  const repost  = document.getElementById('inputRepost').value || '0';
  const verified = document.getElementById('inputVerified').value === 'yes';

  document.getElementById('cardName').textContent    = name;
  document.getElementById('cardHandle').textContent  = handle;
  document.getElementById('cardTime').textContent    = time;
  document.getElementById('cardContent').textContent = content;
  document.getElementById('likeCount').textContent   = like;
  document.getElementById('replyCount').textContent  = reply;
  document.getElementById('repostCount').textContent = repost;
  document.getElementById('cardVerified').style.display = verified ? 'inline' : 'none';

  const dtInput = document.getElementById('inputDateTime').value;
  let sourceStr = '';
  if (dtInput) {
    const dt = new Date(dtInput);
    sourceStr = dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) + ' · ' +
      dt.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  } else {
    const now = new Date();
    sourceStr = now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) + ' · ' +
      now.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  }
  document.getElementById('sourceText').textContent = sourceStr;

  if (avatarData) document.getElementById('cardAvatar').src = avatarData;
}

function takeScreenshot() {
  const card = document.getElementById('postCard');
  html2canvas(card, {
    backgroundColor: null,
    scale: 2,
    useCORS: true,
    allowTaint: true,
    logging: false
  }).then(canvas => {
    const a = document.createElement('a');
    a.download = 'fake-post-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

// Init
update();
</script>
</body>
</html>
